# PPO hyperparameters (section 18), consumed by
# source/physics_ot_tasks/.../agents/rsl_rl_ppo_cfg.py

num_envs_debug: 512
num_envs_train: 2048

gamma: 0.99
gae_lambda: 0.95

learning_rate: 3.0e-4
clip_param: 0.2

entropy_coef: 0.01
value_loss_coef: 1.0

num_steps_per_env: 32
num_learning_epochs: 5
num_mini_batches: 4

actor_hidden_dims: [256, 256, 128]
critic_hidden_dims: [256, 256, 128]
activation: elu

max_iterations: 10000
save_interval: 250
