[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-ot"
version = "0.1.0"
description = "Physics-OT: cross-embodiment manipulation from egocentric human video via dynamic physical task transport"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["physics_ot*"]
